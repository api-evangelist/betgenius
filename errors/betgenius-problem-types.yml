method: derived
source: openapi/betgenius-video-v3-openapi.yml
enriched_from:
  - https://dap-docs.betstream.betgenius.com/video-player/error-handling
  - https://geniussports.atlassian.net/wiki/spaces/BID/pages/3925901961/Match+State+Platform+APIs+Authentication
format: rfc7807
note: >-
  Only one BetGenius surface publishes a machine-readable error contract: the Video Streaming API
  v3, which declares an RFC 7807 `Problem` schema on 400/401/403/404 across all seven operations.
  It publishes the ENVELOPE but not the registry — no `type` URIs are enumerated, so a client can
  parse the shape but cannot switch on a stable problem type. The Booking API publishes no error
  responses at all. The player error codes below are a separate, genuinely enumerated catalogue,
  but they are delivered as a browser CustomEvent rather than an HTTP response.
envelope:
  media_type: application/problem+json
  schema: Problem
  fields:
    - name: type
      format: uri
      description: An absolute URI that identifies the problem type.
    - name: title
      description: A short summary of the problem type, in English, written for engineers.
    - name: status
      format: int32
      description: The HTTP status code generated by the origin server.
    - name: detail
      description: A human-readable explanation specific to this occurrence.
    - name: instance
      format: uri
      description: A URI that identifies the specific occurrence.
  registry_published: false
problems:
  - status: 400
    title: Bad Request
    format: rfc7807
    source_operations:
      - openapi/betgenius-video-v3-openapi.yml#getFixtures
      - openapi/betgenius-video-v3-openapi.yml#getFixture
      - openapi/betgenius-video-v3-openapi.yml#getRegions
      - openapi/betgenius-video-v3-openapi.yml#createHLSStream
      - openapi/betgenius-video-v3-openapi.yml#createDASHStream
      - openapi/betgenius-video-v3-openapi.yml#createSRTStream
      - openapi/betgenius-video-v3-openapi.yml#createHlsVod
  - status: 401
    title: Unauthorized
    format: rfc7807
    remediation: >-
      Bearer token missing, malformed or expired. Cognito access tokens are valid for 3600s; fetch
      a new one from the client_credentials token endpoint.
    source_operations:
      - openapi/betgenius-video-v3-openapi.yml#getFixtures
      - openapi/betgenius-video-v3-openapi.yml#createHLSStream
  - status: 403
    title: Forbidden
    format: rfc7807
    remediation: >-
      Entitlement failure rather than an auth failure — the client is authenticated but not
      licensed for that fixture, sport, source, region or DMA.
    source_operations:
      - openapi/betgenius-video-v3-openapi.yml#getFixtures
      - openapi/betgenius-video-v3-openapi.yml#createHLSStream
  - status: 404
    title: Not Found
    format: rfc7807
    source_operations:
      - openapi/betgenius-video-v3-openapi.yml#getFixture
      - openapi/betgenius-video-v3-openapi.yml#createHLSStream
gateway_errors:
  format: bare-json
  note: >-
    The AWS API Gateway estate (Match State Platform, Access Control, Schedule, Statistics) does
    NOT return problem+json. It returns the gateway default envelope with a capital-M `Message`.
    A client parsing RFC 7807 will fail to read these.
  examples:
    - condition: invalid or expired access_token
      body: '{"Message": "Access Denied"}'
    - condition: invalid or missing x-api-key
      body: '{"Message": "Unauthorized"}'
  source: https://geniussports.atlassian.net/wiki/spaces/BID/pages/3925901961/Match+State+Platform+APIs+Authentication
player_error_codes:
  transport: browser CustomEvent
  event: player_not_ready
  envelope: 'window "geniussportsmessagebus" event, detail.body.error[] of {code, message, details}'
  method: searched
  source: https://dap-docs.betstream.betgenius.com/video-player/error-handling
  codes:
    - code: 1001
      message: Region or device not allowed
      details: >-
        The region or device provided is not allowed to stream the given fixture Id, please consult
        the permissions of the fixture.
      class: entitlement
    - code: 1002
      message: Dma zone not allowed
      details: The requested fixture cannot be streamed due to restrictions on the user's DMA zone.
      class: entitlement
    - code: 1003
      message: No deliveries found
      details: >-
        There are no allowed deliveries found in the fixture - Please reach out to Genius support
        for assistance.
      class: availability
    - code: 1004
      message: Video cannot be played
      details: >-
        We are unable to stream the requested fixture at the moment. Please try again later or
        contact support for assistance.
      class: transient
  note: >-
    Geo/DMA blocking is enforced at the edge and is partly SILENT: "If a user is not in a DMA where
    they can view a fixture, the video player will never dispatch the 'player_ready' event, and the
    player will not be visible." An integrator must treat the absence of an event as a distinct,
    unreported failure mode alongside these four codes.
gaps:
  - No `type` URI registry is published for the RFC 7807 problems, so problem types are not switchable.
  - The Booking API declares no 4xx/5xx responses whatsoever in either V1 or V2.
  - Two incompatible error envelopes (problem+json and `{"Message": ...}`) on one platform.
  - The rate-limit response for Booking GetFixtures is described in prose but has no documented status code or shape.
