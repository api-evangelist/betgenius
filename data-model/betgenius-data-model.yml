enumerations:
  - name: FixturePhase
    note: Fixture lifecycle phase, e.g. PRE_MATCH.
  - name: BookingStatus
    note: e.g. BOOKED.
  - name: Device
    note: e.g. MOBILE, TABLET. Governs which Permission applies.
  - name: DRM
    values_documented: [Widevine, FairPlay]
    note: FairPlay requires both the fairplay and fairplayCertificate values in the response.
external_identifiers:
  - field: CustomerFixtureId
    description: The operator's own id for a fixture, echoed back by the Booking API.
  - field: 'ExternalIds[].Source / .Id'
    description: Third-party provider ids carried on the fixture.
  - field: sportsbookFixtureId / sportsbookMarketId / sportsbookSelectionId
    description: >-
      Carried on the BetVision `addToBetslip` multibet event so the operator can resolve a
      selection in its own catalogue. See components/betgenius-components.yml.
cross_domain_ids:
  note: >-
    sportId is a stable platform-wide integer — 10 is Football (soccer), 17 is American Football,
    as evidenced by both the Statistics API paths (/v3/sports/17/...) and the published OAuth scope
    form `matchstateapi/sport.10`. Fixture ids are shared across Booking, Video, Match State and
    the Fixtures API v2 catalogued under all/genius-sports/.
