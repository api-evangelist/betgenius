regulatory_context:
  note: >-
    BetGenius operates in licensed gambling markets and its own restrictions page is explicit about
    the regulatory perimeter — video is "Limited to Active Bettors currently logged-in to the
    bookmaker account, and physically located in a state where betting on such account is legal and
    regulated", with region and DMA enforcement at the edge. That is a real compliance control
    expressed in the product, but it is a rights/licensing control, not a published information
    security certification.
