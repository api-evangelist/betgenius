  - aid: betgenius:betgenius-booking-api-v1
    name: BetGenius Booking API V1
    description: >-
      The pre-v2 Booking API, still served alongside V2 from the same Swashbuckle discovery list.
      The same three operations on the /api/booking path; the only contract difference from V2 is
      that its Feed object has no Metadata map. Retained rather than sunset — there is no published
      deprecation policy and no Sunset header.
    humanURL: https://geniussports.atlassian.net/wiki/spaces/BID/pages/36084721/Booking+API
