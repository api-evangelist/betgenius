  - aid: betgenius:betgenius-video-streaming-api-v3
    name: BetGenius Video Streaming API v3
    description: >-
      The server-side half of BetVision and the Genius Live Player. Lists fixtures with live and
      VOD streams together with their per-stream entitlement (device, region, DMA, maximum player
      size), lists supported playback regions, and exchanges a stream and delivery id for an
      authorised HLS, DASH, SRT or VOD playback URL plus DRM configuration. OAuth2 bearer token
      plus an issued x-api-key; RFC 7807 problem details on errors. The provider states this API
      must never be called from end-user browser code.
    humanURL: https://dap-docs.betstream.betgenius.com/video-player/introduction
    baseURL: https://api.geniussports.com/Video-v3/PRODPRM
    tags:
