apis:
  - aid: betgenius:betgenius-booking-api-v2
    name: BetGenius Booking API V2
    description: >-
      The current Booking API. Three operations that let a contracted sportsbook list the upcoming
      fixtures it can book, book a fixture to turn on its data feeds, and un-book it again. Served
      from BetGenius's own host with HTTP Basic credentials issued by the Genius Sports Support
      team. Reads are governed by a ten-minute cooldown per sport and a maximum seven-day fixture
      window; writes carry no idempotency contract.
    humanURL: https://geniussports.atlassian.net/wiki/spaces/BID/pages/36084721/Booking+API
    baseURL: https://dataservices.betgenius.com/BookingSystem
    tags:
