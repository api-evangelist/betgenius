      security:
      - CognitoPool: []
      - api_key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SRTStreamRequest'
        required: true
      summary: Create SRT stream
      x-summary-source: derived
  /fixtures/{id}/vod-streams/{streamId}/deliveries/hls/{deliveryId}:
    post:
      tags:
      - Fixtures
      description: Returns the VOD URLs for a stream
      operationId: createHlsVod
      parameters:
      - name: deliveryId
        in: path
        description: The source ID
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: The Genius Sports fixture ID
        required: true
        schema:
          type: string
      - name: streamId
        in: path
        description: The stream ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HLS streaming parameters.
          content:
            application/problem+json:
              schema:
