openapi: 3.2.0
info:
  description: 'Video Streaming API


    The video streaming API is used by customers to:


    Retrieve the schedule of upcoming streams.'
  version: 3.4.1
  title: Video-v3 Fixtures API
  contact:
    name: GeniusLive integration manager
    email: videointegrationgroup@geniussports.com
servers:
- url: https://api.geniussports.com/Video-v3/PRODPRM
tags:
- name: Fixtures
  description: The fixtures API
paths:
  /fixtures:
    get:
      tags:
      - Fixtures
      description: Returns the list of available fixtures for streaming.
      operationId: getFixtures
      parameters:
      - name: toDate
        in: query
        description: End date of the window where the fixtures retreived will be filtered, this is inclusive.
        required: false
        schema:
          type: string
      - name: competitionIds
        in: query
        description: A comma-separated list of competition IDs to filter by. If a competition ID is not present, it will display all fixtures regardless of competition ID value.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: This is the maximum number of objects that may be returned. A query may return fewer than the value of limit due to filtering. Do not depend on the number of results being fewer than the limit value to indicate that your query reached the end of the list of data, use the absence of next instead. For example, if you set limit to 10 and 9 results are returned, there may be more data available, but one item was removed due to filtering. In all cases, the API returns the correct pagination links.
        required: false
        schema:
          type: string
      - name: showPermissions
        in: query
        description: Flag used to request permissions for each of the fixtures
        required: false
        schema:
          type: string
      - name: before
        in: query
        description: This is the cursor that points to the start of the page.
        required: false
        schema:
          type: string
      - name: after
        in: query
        description: This is the cursor after which to start returning data.
        required: false
        schema:
          type: string
      - name: sportIds
        in: query
        description: A comma-separated list of sport IDs to filter by. If a sport ID is not present, it will display all fixtures regardless of sport ID value.
        required: false
        schema:
          type: string
      - name: phases
        in: query
        description: 'A comma-separated list of fixture phases to filter by. If a phase is not present, it will display all fixtures regardless of phase value. The values must be one of: {PRE_MATCH, IN_PLAY, RESULTED}.'
        required: false
        schema:
          type: string
      - name: bookingStatus
        in: query
        description: 'The booking status to filter by. If not present, it will display all available fixtures. The value must be one of: {BOOKED, UNBOOKED}.'
        required: false
        schema:
          type: string
      - name: fromDate
        in: query
        description: Start date of the window where the fixtures retrieved will be filtered, this is inclusive and the difference between the start date and the end date should not be more than 10 days.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of fixtures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixturesPage'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FixturesPage'
        '400':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - CognitoPool: []
      - api_key: []
      summary: Get fixtures
      x-summary-source: derived
  /fixtures/{id}:
    get:
      tags:
      - Fixtures
      description: Returns the information of a given fixture.
      operationId: getFixture
      parameters:
      - name: id
        in: path
        description: The Genius Sports fixture ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A fixture.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fixture'
            application/json:
              schema:
                $ref: '#/components/schemas/Fixture'
        '400':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - CognitoPool: []
      - api_key: []
      summary: Get fixture
      x-summary-source: derived
  /fixtures/{id}/live-streams/{streamId}/deliveries/dash/{deliveryId}:
    post:
      tags:
      - Fixtures
      description: Creates the DASH streaming data for a given fixture, stream and delivery. For this, data about the end-user is required to compute whether or not it is authorized for streaming based on the licensing rules for this stream.
      operationId: createDASHStream
      parameters:
      - name: deliveryId
        in: path
        description: The source ID
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: The Genius Sports fixture ID
        required: true
        schema:
          type: string
      - name: streamId
        in: path
        description: The stream ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: DASH streaming parameters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DASHStreamResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DASHStreamResponse'
        '400':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - CognitoPool: []
      - api_key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DASHStreamRequest'
        required: true
      summary: Create DASH stream
      x-summary-source: derived
  /fixtures/{id}/live-streams/{streamId}/deliveries/hls/{deliveryId}:
    post:
      tags:
      - Fixtures
      description: Creates the HLS streaming data for a given fixture, stream and delivery. For this, data about the end-user is required to compute whether or not it is authorized for streaming based on the licensing rules for this stream.
      operationId: createHLSStream
      parameters:
      - name: deliveryId
        in: path
        description: The source ID
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: The Genius Sports fixture ID
        required: true
        schema:
          type: string
      - name: streamId
        in: path
        description: The stream ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HLS streaming parameters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HLSStreamResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/HLSStreamResponse'
        '400':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - CognitoPool: []
      - api_key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HLSStreamRequest'
        required: true
      summary: Create HLS stream
      x-summary-source: derived
  /fixtures/{id}/live-streams/{streamId}/deliveries/srt/{deliveryId}:
    post:
      tags:
      - Fixtures
      description: Returns the SRT url endpoint for the stream and delivery.
      operationId: createSRTStream
      parameters:
      - name: deliveryId
        in: path
        description: The source ID
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: The Genius Sports fixture ID
        required: true
        schema:
          type: string
      - name: streamId
        in: path
        description: The stream ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SRT streaming parameters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SRTStreamResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SRTStreamResponse'
        '400':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: A base [RFC-7807](https://tools.ietf.org/html/rfc7807) error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
