test_credentials:
  published: false
  note: >-
    No shared sandbox key, no public demo customerId, no test username/password is published for
    any surface. Booking UAT needs a Support-issued Basic credential; the platform APIs need an
    issued client_id/client_secret plus an x-api-key; the player needs a customerId and a shared
    secret from the Genius onboarding team for the HMAC digest. Every path to a first call runs
    through a human.
time_simulation:
  supported: false
  note: >-
    No test clocks. Time is simulated only in the sense that GeniusPremiumReplay replays a real
    historic match at real cadence.
