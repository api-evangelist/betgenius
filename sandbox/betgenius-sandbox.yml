note: >-
  BetGenius ships a real UAT tier across every surface, and it is addressed by HOSTNAME rather than
  by a key prefix or a mode flag — there is no `test_` vs `live_` credential convention here, so a
  client points at a different host and uses different issued credentials. Crucially, UAT is still
  gated: the docs publish the environment URLs but never a shared test credential, so an
  unlicensed developer cannot exercise any of it. The one genuinely valuable fixture is
  GeniusPremiumReplay, a replayable historic-match feed built specifically to let an integrator
  rehearse in-play action points off-season.
test_live_separation:
  mechanism: hostname
  key_prefixes: none
  mode_flag: none
  note: >-
    Promotion is a string swap. For the player: "Change the string uat to production in the URL to
    promote to the production environment." For the platform APIs: insert a `uat.` label.
